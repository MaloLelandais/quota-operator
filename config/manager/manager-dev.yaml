apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-operator-controller-manager
  namespace: default
  labels:
    app: quota-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quota-operator
  template:
    metadata:
      labels:
        app: quota-operator
    spec:
      serviceAccountName: quota-operator-sa
      containers:
        - name: manager
          image: quota-operator:dev
          imagePullPolicy: Never
          args:
            - "--metrics-bind-address=:8080"
            - "--metrics-secure=false"
            - "--health-probe-bind-address=:8081"
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quota-operator-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quota-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
  - kind: ServiceAccount
    name: quota-operator-sa
    namespace: default