---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-quota-malolelandais-dev-v1alpha1-namespacequotapolicy
  failurePolicy: Fail
  name: vnamespacequotapolicy.kb.io
  rules:
  - apiGroups:
    - quota.malolelandais.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - namespacequotapolicies
  sideEffects: None
